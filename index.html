<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Phones: the layout is the 393 px Figma frame and the browser (or the app's webview) scales it
      // to the screen width: 1:1 on a 393 pt iPhone, ×1.023 / ×1.069 / ×1.12 on 402 / 420 / 440 pt,
      // slightly down on 390 / 375: type, spacing, photos, buttons. Tablets and desktop (and `?fit=0`)
      // keep device-width.
      (function () {
        var w = Math.min(screen.width, screen.height);
        if (w <= 480 && w !== 393 && !/[?&]fit=0\b/.test(location.search)) {
          document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=393, viewport-fit=cover');
          // WebKit reports env(safe-area-inset-*) in device points, and the page is then scaled by
          // screen / 393: --vp-inv (393 / w) takes that scale back out, so 62 pt stays 62 pt (tokens.css).
          document.documentElement.style.setProperty('--vp-inv', String(393 / w));
        }
      })();
    </script>
    <!-- Status-bar strip in a Safari tab: dark over the cover; the screen switches it to white with the white appbar. -->
    <meta name="theme-color" content="#0f0f13" />
    <!-- Added to the Home Screen it opens full screen with the photo under the status bar, like the app's webview. -->
